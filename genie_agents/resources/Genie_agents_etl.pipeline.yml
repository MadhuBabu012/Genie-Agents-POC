# Simbus Fashion — full medallion pipeline (bronze → silver → gold)
# Source data lives in genie_agents_poc.bronze (landing volume + existing bronze tables).
# All pipeline outputs land in genie_agents_poc (bronze / silver / gold schemas).

resources:
  pipelines:
    genie_agents_poc_pipeline:
      name: genie_agents_poc_pipeline
      catalog: ${var.target_catalog}
      schema: ${var.bronze_schema}
      serverless: true

      configuration:
        source_catalog:  ${var.source_catalog}
        source_schema:   ${var.source_schema}
        target_catalog:  ${var.target_catalog}
        bronze_schema:   ${var.bronze_schema}
        silver_schema:   ${var.silver_schema}
        gold_schema:     ${var.gold_schema}

      libraries:
        - glob:
            include: ../src/Genie_agents_etl/transformations/**

