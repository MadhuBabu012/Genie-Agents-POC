# Databricks Asset Bundle — Simbus Fashion Genie & Agents POC
bundle:
  name: Genie_agents
  uuid: 4cff1388-455f-4486-a342-ddbd146f9620

include:
  - resources/*.yml

variables:
  source_catalog:
    description: Catalog that owns the landing volume and existing bronze data
    default: genie_agents_poc
  source_schema:
    description: Schema inside source_catalog that owns the landing volume
    default: bronze
  target_catalog:
    description: Catalog where all pipeline outputs are written (bronze/silver/gold)
    default: genie_agents_poc
  bronze_schema:
    description: Schema for raw bronze tables
    default: bronze
  silver_schema:
    description: Schema for cleaned silver tables
    default: silver
  gold_schema:
    description: Schema for gold star-schema tables and metric views
    default: gold

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-cb8a7372-40bf.cloud.databricks.com
    variables:
      source_catalog:  genie_agents_poc
      source_schema:   bronze
      target_catalog:  genie_agents_poc
      bronze_schema:   bronze
      silver_schema:   silver
      gold_schema:     gold

  prod:
    mode: production
    workspace:
      host: https://dbc-cb8a7372-40bf.cloud.databricks.com
      root_path: /Workspace/Users/babyramya.yalagandula@simbustech.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      source_catalog:  genie_agents_poc
      source_schema:   bronze
      target_catalog:  genie_agents_poc
      bronze_schema:   bronze
      silver_schema:   silver
      gold_schema:     gold
    permissions:
      - user_name: madhubabu.duggirala@simbustech.com
        level: CAN_MANAGE
